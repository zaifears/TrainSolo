version: '3.8'

services:
  trainsolo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trainsolo-service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SHOHOZ_BASE_API=https://railspaapi.shohoz.com/v1.0/web
      - CLIENT_URL=*
